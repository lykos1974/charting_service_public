::-webkit-scrollbar {
  width: 5px;
  height: 10px;
}
::-webkit-scrollbar-button {
  width: 0px;
  height: 0px;
}
::-webkit-scrollbar-thumb {
  background: #666666; /*this is the bar color*/
  border: 0px none #3361A1;
  border-radius: 50px;
}
::-webkit-scrollbar-thumb:hover {
  background: #3361A1; /*when mouse up*/
}
::-webkit-scrollbar-thumb:active {
  background: #3361A1; /*when mouse down*/
}
::-webkit-scrollbar-track {
  background: #000000; /*rest when inactive*/
  border: 0px none #3361A1;
  border-radius: 0px;
}
::-webkit-scrollbar-track:hover {
  background: #000000; /*rest when hover*/
}
::-webkit-scrollbar-track:active {
  background: #000000; /*rest when mouse down*/
}
::-webkit-scrollbar-corner {
  background: transparent;
}

.overlay {
  position: fixed;
  top: 0;
  bottom: 0;
  left: 0;
  right: 0;
  background: rgba(0, 0, 0, 0.7);
  transition: opacity 500ms;
  visibility: hidden;
  opacity: 0;
}
.overlay:target {
  visibility: visible;
  opacity: 1;
}

.popup {
  margin: 70px auto;
  padding: 15px;
  background: #fff;
  border-radius: 5px;
  /*width: 30%;*/
  width:320px;
  position: relative;
  transition: all 5s ease-in-out;
}

.popup h2 {
  margin-top: 0;
  color: #333;
  font-family: Tahoma, Arial, sans-serif;
}
.popup .close {
  position: absolute;
  top: 20px;
  right: 30px;
  transition: all 200ms;
  font-size: 30px;
  font-weight: bold;
  text-decoration: none;
  color: #333;
}
.popup .close:hover {
  color: #06D85F;
}
.popup .content {
  max-height: 60%;
  overflow: auto;
}

@media screen and (max-width: 700px){
  .box{
    width: 70%;
  }
  .popup{
    width: 70%;
  }
}

            function loadSVG() {
                // Code to show elements
                document.getElementById( 'Drawing' ).style.display = 'inline-block';
                document.getElementById( 'BuSL' ).style.display = 'inline-block';
                document.getElementById( 'BeSL' ).style.display = 'inline-block';
                document.getElementById( 'BuTL' ).style.display = 'inline-block';
                document.getElementById( 'BeTL' ).style.display = 'inline-block';


                $('#clickable').click(function(e) {

                    if($('#BuSL').data('clicked')) {
                        // Bullish support line creation
                        var offset_t = $(this).offset().top - $(window).scrollTop();
                        var offset_l = $(this).offset().left - $(window).scrollLeft();

                        var left = Math.round( (e.clientX - offset_l) );
                        var top = Math.round( (e.clientY - offset_t) );

                        //alert("Left: " + left + " Top: " + top);
                        var newLine = document.createElementNS('http://www.w3.org/2000/svg','line');
                        newLine.setAttribute('id','line2');
                        newLine.setAttribute('x1','0');
                        newLine.setAttribute('y1',top);
                        newLine.setAttribute('x2',$(this).width());
                        newLine.setAttribute('y2',top);
                        newLine.setAttribute('fill','black');
                        newLine.setAttribute('stroke','lightgreen');
                        newLine.setAttribute('stroke-width','3');
                        $("#clickable").append(newLine);
                        $('#BuSL').data('clicked', false);
                        }


                    if($('#BeSL').data('clicked')) {
                        // Bearish resistance line creation
                        var offset_t = $(this).offset().top - $(window).scrollTop();

                        var left = Math.round( (e.clientX - offset_l) );

                        newLine.setAttribute('y1',top);

                        newLine.setAttribute('y2',top);

                        newLine.setAttribute('stroke','red');
                        newLine.setAttribute('stroke-width','3');
                        $("#clickable").append(newLine);
                        $('#BeSL').data('clicked', false);
                        }

                        // Bearish resistance trend line creation
                        var offset_t = $(this).offset().top - $(window).scrollTop();
                        var offset_l = $(this).offset().left - $(window).scrollLeft();

                        var left = Math.round( (e.clientX - offset_l) );
